
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Question for You 💗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-hearts">
        <span>♡</span>
        <span>💗</span>
        <span>♡</span>
        <span>💕</span>
        <span>♡</span>
        <span>💗</span>
    </div>

    <main class="container">

        <div class="card">

            <div class="top-icon">☁️</div>

            <p class="small-title">A SPECIAL QUESTION FOR YOU MY pooKIE</p>

            <h1 id="question">
                Will you go on a date with me? 🥺
            </h1>

            <p class="description" id="message">
                would you eat dorito with me when I come over? 💗
            </p>

            <div class="cute-decoration">
                🌷 🧸 🌷
            </div>

            <div class="button-area">

                <button id="yesButton" class="yes-button">
                    Yes, of course handsome 💗
                </button>

                <button id="noButton" class="no-button">
                    No 🙈
                </button>

            </div>

            <p class="footer-text">
                P.S. I hope you choose wisely hehe ♡
            </p>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
